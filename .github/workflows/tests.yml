name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -e ".[dev]"

      - name: pytest
        id: suite
        run: pytest -q 2>&1 | tee suite.log; exit ${PIPESTATUS[0]}

      # Reading a failure from the outside is harder than it looks. The API
      # log endpoint answers 403 to an anonymous request, and the run page
      # answers "Sign in to view logs" even though the repository is public.
      # The summary does not change that, it only saves a signed-in reader
      # from expanding steps.
      - name: put the tail of the run in the summary
        if: always()
        run: |
          echo '### pytest on ${{ matrix.python }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 suite.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The suite claims it opens no socket. A claim a machine can check should
      # be checked by a machine, so the whole thing runs again with outbound
      # traffic refused. It has to pass identically, and any test that quietly
      # reached the FDA or the USDA fails here rather than on a judge's laptop.
      - name: pytest, with the network taken away
        run: |
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          pytest -q
