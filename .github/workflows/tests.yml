name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -e ".[dev]"

      - name: pytest
        id: suite
        run: pytest -q 2>&1 | tee suite.log; exit ${PIPESTATUS[0]}

      # Reading a failure from the outside is harder than it looks. The API
      # log endpoint answers 403 to an anonymous request, and the run page
      # answers "Sign in to view logs" even though the repository is public.
      # The summary does not change that, it only saves a signed-in reader
      # from expanding steps.
      - name: put the tail of the run in the summary
        if: always()
        run: |
          echo '### pytest on ${{ matrix.python }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 suite.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The same suite again, with name resolution and every off-machine
      # connection refused inside the process. A firewall rule was the first
      # idea and it also cut the runner's own link to GitHub.
      - name: pytest, with the network refused
        run: python no_network.py
